# Kitty config — ported from ghostty/config (originally foot/foot.ini)
# Reload with ctrl+shift+f5

shell /bin/zsh

font_family JetBrains Mono
font_size 11

window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0

# Colours (zenburn-ish)
background_opacity 0.9
foreground #dcdccc
background #111111
color0 #222222
color1 #cc9393
color2 #7f9f7f
color3 #d0bf8f
color4 #6ca0a3
color5 #dc8cc3
color6 #93e0e3
color7 #dcdccc
color8 #666666
color9 #dca3a3
color10 #bfebbf
color11 #f0dfaf
color12 #8cd0d3
color13 #fcace3
color14 #b3ffff
color15 #ffffff
