# ~/.tmux.conf — Tokyo Night (night variant). Reload with: prefix + r
# Lines starting with "set -g" are session/global options, "set -s" are server
# options, "set -w"/"setw" are window options, "bind" creates a key binding
# (after the prefix key, unless -n is given).

# ─────────────────────────────────────────────────────────────────────────────
# General
# ─────────────────────────────────────────────────────────────────────────────

# Use Ctrl-a as prefix instead of Ctrl-b (closer to the home row).
set -g prefix C-a
unbind C-b
# Pressing Ctrl-a twice sends a literal Ctrl-a to the program inside (e.g. readline "home").
bind C-a send-prefix

# Number windows and panes from 1, matching the keyboard's number row order.
set -g base-index 1
setw -g pane-base-index 1
# When a window is closed, renumber the rest so there are no gaps.
set -g renumber-windows on

# Mouse: click to select panes/windows, drag borders to resize, scroll to enter copy mode.
set -g mouse on

# Large scrollback buffer.
set -g history-limit 100000

# No delay after pressing Escape (important for Neovim's mode switching).
set -s escape-time 0

# Pass focus events (FocusGained/FocusLost) to Neovim, so autoread/checktime works.
set -g focus-events on
# Lets terminal apps distinguish keys like Ctrl-Enter / Shift-Tab.
set -s extended-keys on

# Show a clean title in the terminal window (no tmux-specific text).
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# Messages (like "Reloaded") stay visible for 2 s instead of tmux's very short default.
set -g display-time 2000
# Window-switch indicator (prefix + q) stays up for 2 s.
set -g display-panes-time 2000
# Status line refresh interval in seconds (drives the git branch and clock).
set -g status-interval 5
# Resize windows to the smallest client looking at *that* window, not the whole session.
setw -g aggressive-resize on
# Keep a window open if its command exits; handy for debugging (can be removed).
# set -g remain-on-exit on

# ─────────────────────────────────────────────────────────────────────────────
# Terminal / colors
# ─────────────────────────────────────────────────────────────────────────────

# Correct terminfo for tmux (italics, true color capable).
set -g default-terminal "tmux-256color"
# Tell tmux the outer terminal supports 24-bit color, required for Tokyo Night.
set -as terminal-features ",*:RGB"
# Allow programs (image previewers, OSC sequences) to pass through tmux to kitty.
set -g allow-passthrough on
# Undercurl and colored underlines (LSP diagnostics in Neovim).
set -as terminal-features ",*:usstyle"

# ─────────────────────────────────────────────────────────────────────────────
# Clipboard (Wayland)
# ─────────────────────────────────────────────────────────────────────────────

# Let programs inside tmux (Neovim, etc.) set the system clipboard via OSC 52.
set -g set-clipboard on
# Anything copied in tmux is piped to wl-copy => system clipboard.
set -s copy-command "wl-copy"

# vi-style keys in copy mode (prefix + [ to enter).
setw -g mode-keys vi
# v starts selection, Ctrl-v toggles rectangle, y copies to the system clipboard and exits.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# Mouse drag-select copies to the system clipboard as soon as you release.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
# prefix + P pastes from the *system* clipboard (prefix + ] pastes tmux's own buffer).
bind P run-shell 'wl-paste --no-newline | tmux load-buffer -b clip - && tmux paste-buffer -p -d -b clip'

# ─────────────────────────────────────────────────────────────────────────────
# Key bindings
# ─────────────────────────────────────────────────────────────────────────────

# prefix + r: reload this file.
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Splits: | is side by side, - is stacked. New panes keep the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# Keep the old split keys working, also in the current directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# New windows also open in the current directory.
bind c new-window -c "#{pane_current_path}"

# Move between panes with vim keys (prefix + h/j/k/l).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Shift + vim keys; -r makes them repeatable without re-pressing prefix.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Cycle windows with Ctrl-h / Ctrl-l (repeatable).
bind -r C-h previous-window
bind -r C-l next-window

# prefix + R: renumber windows (replaces the "ß" binding, which needs a German layout).
bind R move-window -r

# prefix + g: lazygit in a popup that closes when you quit it.
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# ─────────────────────────────────────────────────────────────────────────────
# Tokyo Night colors (night variant)
# ─────────────────────────────────────────────────────────────────────────────
# NAME=value at the top level defines a variable, usable below as ${NAME}.

BG="#16161e"          # status bar background (bg_dark)
BG_HL="#292e42"       # pill / selection background (bg_highlight)
FG="#c0caf5"          # default text
COMMENT="#565f89"     # dimmed text, inactive borders
BLUE="#7aa2f7"
CYAN="#7dcfff"
GREEN="#9ece6a"
MAGENTA="#bb9af7"
ORANGE="#ff9e64"
RED="#f7768e"
YELLOW="#e0af68"

# Nerd Font glyphs (rounded and triangle edges, icons).
HRO=""
HRC=""

# Pane borders: dim for inactive, blue for the active pane.
set -g pane-border-style "fg=${BG_HL}"
set -g pane-active-border-style "fg=${BLUE}"
# Message line (":" prompt and notices) and copy-mode highlight.
set -g message-style "bg=${BG_HL},fg=${YELLOW}"
set -g message-command-style "bg=${BG_HL},fg=${CYAN}"
setw -g mode-style "bg=${BLUE},fg=${BG}"
# Clock shown with prefix + t.
setw -g clock-mode-colour "${BLUE}"

# ─────────────────────────────────────────────────────────────────────────────
# Status line
# ─────────────────────────────────────────────────────────────────────────────

# set -g status-position top   # uncomment to move the bar to the top
set -g status on
set -g status-style "bg=${BG},fg=${FG}"
# Window list centered between the left and right sections.
set -g status-justify centre
set -g status-left-length 100
set -g status-right-length 150

# Left: session name in a rounded pill. It turns orange while the prefix key is
# active, so you can see tmux is waiting for the next key.
set -g status-left "\
#[fg=#{?client_prefix,${ORANGE},${BLUE}},bg=default]${HRO}\
#[fg=${BG},bg=#{?client_prefix,${ORANGE},${BLUE}},bold] #S \
#[fg=#{?client_prefix,${ORANGE},${BLUE}},bg=default,nobold]${HRC} "

# Right: zoom flag | git branch of the current pane | host | date | time.
# The git part (scripts/git_branch.sh) prints nothing outside a repository.
set -g status-right "\
#{?window_zoomed_flag,#[fg=${ORANGE}] ZOOM  ,}\
#[fg=${MAGENTA}]#(~/.config/tmux/scripts/git_branch.sh '#{pane_current_path}')\
#[fg=${BG_HL},bg=default]${HRO}\
#[fg=${GREEN},bg=${BG_HL}] #h \
#[fg=${COMMENT}]│\
#[fg=${YELLOW}]  %a %d %b \
#[fg=${COMMENT}]│\
#[fg=${CYAN}]  %H:%M \
#[fg=${BG_HL},bg=default]${HRC}"

# Inactive windows: dimmed "index:name".
setw -g window-status-format "\
#[fg=${COMMENT}] #I#[fg=${COMMENT}]:#W#{?window_flags,#{window_flags},} "
# Active window: highlighted pill.
setw -g window-status-current-format "\
#[fg=${BG_HL},bg=default]${HRO}\
#[fg=${BLUE},bg=${BG_HL},bold]#I\
#[fg=${ORANGE}]:\
#[fg=${FG}]#W#{?window_flags,#{window_flags},}\
#[fg=${BG_HL},bg=default,nobold]${HRC}"
# No separators; spacing is already in the formats.
setw -g window-status-separator ""
# Windows with activity or a bell are shown in a different color.
setw -g window-status-activity-style "fg=${YELLOW}"
setw -g window-status-bell-style "fg=${RED},bold"

# ─────────────────────────────────────────────────────────────────────────────
# Plugins (managed by TPM, https://github.com/tmux-plugins/tpm)
# ─────────────────────────────────────────────────────────────────────────────
# In tmux: prefix + I installs new plugins, prefix + U updates, prefix + alt-u removes unlisted ones.

# The plugin manager itself.
set -g @plugin 'tmux-plugins/tpm'

# tmux-resurrect: save/restore sessions, windows, panes and their directories.
#   prefix + Ctrl-s  save        prefix + Ctrl-r  restore
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Also save the visible contents of each pane's scrollback.
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum: saves automatically (using resurrect) and restores on tmux start.
# Must be listed after resurrect and after status-right is set, so it can hook into it.
set -g @plugin 'tmux-plugins/tmux-continuum'
# Restore the last saved environment automatically when the tmux server starts.
set -g @continuum-restore 'on'
# Save every 15 minutes (0 disables autosave).
set -g @continuum-save-interval '15'

# Keep this line at the very bottom: it loads all plugins above.
run '~/.tmux/plugins/tpm/tpm'
